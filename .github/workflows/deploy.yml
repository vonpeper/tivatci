name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install paramiko

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '66.29.152.229' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '2226' }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME || 'jose' }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/deploy_vps.py
