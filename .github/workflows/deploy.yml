name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS (propodvps1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install paramiko

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '66.94.114.222' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '2226' }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME || 'jose' }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD || 'BvJhdx2S77NOv3Oqx62UwsX/' }}
          SUDO_PASS: "BvJhdx2S77NOv3Oqx62UwsX/"
        run: python scripts/deploy_vps.py
