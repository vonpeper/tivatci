services:
  tiva:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiva-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tiva.rule=Host(`tivataller.com`) || Host(`www.tivataller.com`)"
      - "traefik.http.routers.tiva.entrypoints=websecure"
      - "traefik.http.routers.tiva.tls=true"
      - "traefik.http.routers.tiva.tls.certresolver=letsencrypt"
      - "traefik.http.services.tiva.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  dokploy-network:
    external: true
